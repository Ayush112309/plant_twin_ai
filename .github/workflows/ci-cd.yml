name: PlantTwin AI Platform CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Test Suite (FastAPI + Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          cd planttwin-backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Backend Syntax & Import Checks
        run: |
          cd planttwin-backend
          python -c "import app.main; print('FastAPI App Import Successful')"

  frontend-build:
    name: Frontend Build Check (React + Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install & Build Frontend
        run: |
          cd planttwin-frontend
          npm ci
          npm run build
