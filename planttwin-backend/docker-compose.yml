version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: planttwin_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=planttwin
      - POSTGRES_PASSWORD=planttwin_secret
      - POSTGRES_DB=planttwin_db
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET_KEY=planttwin_super_secret_jwt_key_32bytes_min!
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app

  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: planttwin_postgres
    restart: always
    environment:
      POSTGRES_USER: planttwin
      POSTGRES_PASSWORD: planttwin_secret
      POSTGRES_DB: planttwin_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: planttwin_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
