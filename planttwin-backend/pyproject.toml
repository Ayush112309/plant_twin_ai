[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "planttwin-backend"
version = "2.0.0"
description = "PlantTwin AI Enterprise Industrial IoT & Digital Twin Platform Backend"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "PlantTwin AI Engineering Team", email = "engineering@planttwin.ai" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "redis>=5.0.3",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "celery>=5.3.6",
    "opcua>=0.98.13",
    "gmqtt>=0.6.12",
    "pymodbus>=3.6.8",
    "scikit-learn>=1.4.1.post1",
    "numpy>=1.26.4",
    "pandas>=2.2.1",
    "prometheus-client>=0.20.0",
    "structlog>=24.1.0",
    "websockets>=12.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "black>=24.3.0",
    "isort>=5.13.2",
    "flake8>=7.0.0",
    "mypy>=1.9.0"
]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = [
    "tests",
]
